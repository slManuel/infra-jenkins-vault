name: Planificar y aplicar infraestructura

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-herramientas
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_WORKSPACE: default
  TF_VAR_aws_account_id: "022907376152"
  AWS_REGION: us-east-1
  AWS_DEFAULT_REGION: us-east-1
  AWS_PAGER: ""

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.15.9
          terraform_wrapper: false
      - run: terraform fmt -check -recursive -diff
      - run: terraform init -backend=false -input=false -lockfile=readonly
      - run: terraform validate

  deploy:
    needs: checks
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.15.9
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::022907376152:role/prueba-devops-github-actions-jenkins-vault
          aws-region: us-east-1
          allowed-account-ids: "022907376152"
          role-session-name: herramientas-${{ github.run_id }}
      - name: Diagnosticar lectura del rol vinculado sin aplicar
        run: |
          python3 - <<'PY'
          import subprocess
          result = subprocess.run(
              ["aws", "iam", "get-role", "--role-name", "AWSServiceRoleForAmazonEKSNodegroup",
               "--query", "Role.Arn", "--output", "json"],
              capture_output=True, text=True
          )
          print("GetRole exit:", result.returncode)
          print(result.stdout.strip() or result.stderr.strip())
          raise SystemExit("Diagnóstico terminado: este commit no ejecuta plan ni apply.")
          PY
      - name: Comprobar catálogo fijado y subredes
        run: |
          umask 077
          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path
          def aws(*args):
              return json.loads(subprocess.check_output(["aws", *args, "--output", "json"], text=True))
          fixed = json.loads(Path(".github/catalogo-verificado.json").read_text())
          for name, version in fixed["addons"].items():
              data = aws("eks", "describe-addon-versions", "--kubernetes-version", fixed["kubernetes"], "--addon-name", name)
              versions = [v for a in data["addons"] for v in a["addonVersions"]]
              if not any(v["addonVersion"] == version and "amd64" in v["architecture"]
                         and "ec2" in v.get("computeTypes", ["ec2"]) for v in versions):
                  raise SystemExit("Versión fijada ya no compatible: " + name)
              print(name + ": " + version + " compatible")
          images = aws("ec2", "describe-images", "--owners", "amazon", "--image-ids", fixed["ami"]["ImageId"])["Images"]
          if len(images) != 1 or images[0]["State"] != "available":
              raise SystemExit("AMI fijada no disponible.")
          print("AMI AL2023 fijada disponible: " + fixed["ami"]["ImageId"])
          subprocess.run(["aws", "s3api", "get-object", "--bucket",
                          "tfstate-prueba-cuscatlan-oct2026-jose-manuel-solis", "--key",
                          "red-compartida/terraform.tfstate", "red.tfstate"], check=True, stdout=subprocess.DEVNULL)
          state = json.loads(Path("red.tfstate").read_text())
          outputs = state["outputs"]
          subnet_map = outputs["private_subnet_ids_by_az"]["value"]
          if set(subnet_map) != {"us-east-1a", "us-east-1b"}:
              raise SystemExit("Mapa de subredes inesperado.")
          for az, subnet_id in subnet_map.items():
              subnet = aws("ec2", "describe-subnets", "--subnet-ids", subnet_id)["Subnets"][0]
              if (subnet["AvailabilityZone"] != az or subnet["MapPublicIpOnLaunch"]
                  or subnet["VpcId"] != outputs["vpc_id"]["value"]):
                  raise SystemExit("Subred privada no coincide con el estado.")
          Path("red.tfstate").unlink()
          print("Dos subredes privadas verificadas en sus AZ y VPC.")
          PY
      - name: Inicializar y validar
        run: |
          terraform init -input=false -lockfile=readonly
          terraform validate
      - name: Planificar y comprobar alcance
        run: |
          umask 077
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess
          from pathlib import Path
          result = subprocess.run(
              ["terraform", "plan", "-input=false", "-lock-timeout=5m", "-out=infra.tfplan"],
              stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True
          )
          Path("plan.log").write_text(result.stdout)
          if result.returncode:
              for action in sorted(set(re.findall(r"not authorized to perform: ([A-Za-z0-9:]+)", result.stdout))):
                  print("Permiso denegado: " + action)
              raise SystemExit("Plan fallido; log conservado en artefacto privado.")
          plan = json.loads(subprocess.check_output(["terraform", "show", "-json", "infra.tfplan"], text=True))
          expected = set(json.loads(Path(".github/recursos-autorizados.json").read_text()))
          counts = {"create": 0, "no-op": 0}
          for change in plan.get("resource_changes", []):
              if change.get("mode") == "data":
                  continue
              address = change["address"]
              actions = change["change"]["actions"]
              if address not in expected or actions not in (["create"], ["no-op"]):
                  raise SystemExit("Cambio fuera del alcance inicial autorizado: " + address + " " + str(actions))
              counts[actions[0]] += 1
              print(address + ": " + actions[0])
          if sum(counts.values()) != len(expected):
              raise SystemExit("El plan no cubre los recursos autorizados.")
          text = "Plan verificado: " + str(counts["create"]) + " creaciones, 0 cambios, 0 eliminaciones."
          print(text)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write(text + "\n")
          PY
      - name: Guardar plan privado para revisión
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: terraform-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            infra.tfplan
            plan.log
          if-no-files-found: ignore
          retention-days: 1
      - name: Comprobar main antes de aplicar
        run: |
          head="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          test "$head" = "$GITHUB_SHA"
      - name: Aplicar el mismo plan guardado
        run: |
          umask 077
          python3 - <<'PY'
          import os
          import re
          import subprocess
          from pathlib import Path
          result = subprocess.run(
              ["terraform", "apply", "-input=false", "-lock-timeout=5m", "infra.tfplan"],
              stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True
          )
          Path("apply.log").write_text(result.stdout)
          for text in re.findall(r"Apply complete! Resources: [^\n]+", result.stdout):
              print(text)
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
                  summary.write(text + "\n")
          for action in sorted(set(re.findall(r"not authorized to perform: ([A-Za-z0-9:]+)", result.stdout))):
              print("Permiso denegado: " + action)
          raise SystemExit(result.returncode)
          PY
      - name: Verificar infraestructura desplegada
        run: |
          python3 - <<'PY'
          import json
          import subprocess
          def aws(*args):
              return json.loads(subprocess.check_output(["aws", *args, "--output", "json"], text=True))
          name = "prueba-devops-jenkins-vault"
          cluster = aws("eks", "describe-cluster", "--name", name)["cluster"]
          assert cluster["status"] == "ACTIVE"
          assert cluster["version"] == "1.36"
          assert cluster["resourcesVpcConfig"]["endpointPrivateAccess"]
          assert not cluster["resourcesVpcConfig"]["endpointPublicAccess"]
          print("Clúster ACTIVE, Kubernetes1.36, API solo privada.")
          for node_name, instance in [("jenkins", "t3.large"), ("vault", "t3.medium")]:
              node = aws("eks", "describe-nodegroup", "--cluster-name", name, "--nodegroup-name", node_name)["nodegroup"]
              assert node["status"] == "ACTIVE" and not node.get("health", {}).get("issues")
              assert node["instanceTypes"] == [instance]
              assert node["scalingConfig"] == {"minSize": 1, "maxSize": 1, "desiredSize": 1}
              assert node["releaseVersion"] == "1.36.4-20261003"
              print(node_name + ": ACTIVE, " + instance + ", un nodo, AMI fijada.")
          for addon_name in ["eks-pod-identity-agent", "vpc-cni", "aws-ebs-csi-driver"]:
              addon = aws("eks", "describe-addon", "--cluster-name", name, "--addon-name", addon_name)["addon"]
              assert addon["status"] == "ACTIVE" and not addon.get("health", {}).get("issues")
              print(addon_name + ": ACTIVE, " + addon["addonVersion"])
          PY
      - name: Guardar diagnóstico privado de apply
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: terraform-diagnostico-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            apply.log
            errored.tfstate
          if-no-files-found: ignore
          retention-days: 1
